# Repo-wide test workflow (task 1.2 exit criterion: C-2/C-3 green in CI
# using containers). The postgres-marked tests spin real containers —
# Docker is available on ubuntu-latest runners. Tasks 1.3/1.4 reuse this
# workflow; connectors must not add their own.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Ruling D-123.2, finding A6-F1: no tracked file may carry a NUL byte,
  # because git then calls the file binary and every diff of it renders as
  # "Bin N -> M bytes". Three source files were unreviewable that way for
  # four milestones. Its own job rather than a step inside `tests`: it
  # needs no Python package, no Docker and no containers, so it answers in
  # seconds and a PR learns about an unreviewable diff before the suites
  # have finished pulling images. The same check runs inside pytest
  # (tests/test_nul_scan.py) so it holds locally too.
  nul-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No NUL bytes in tracked files (A6-F1 / D-123.2)
        run: python -m tools.nul_scan

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]' -c constraints.txt
      - name: Pre-pull postgres image
        run: docker pull --quiet postgres:16
      - name: Run full suite (incl. postgres containers)
        run: python -m pytest -v

  # Core service (TypeScript): CP-3a protocol conformance (JC), queue
  # property tests, e2e against real Python runner processes, and the
  # CP-3b sync-orchestrator conformance suite (SO-1..SO-12; SO-4 runs
  # the drill fixture through the real pipeline against a local scratch
  # KB repo — SO-4's live variant is the deployment gate, not CI). Needs
  # the Python package installed — the J-6 delivery gate, the sync stage
  # CLIs, and the runners are the actual Python implementations (rulings
  # C1/C2), never TS ports.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package (delivery gate + e2e runner)
        run: python -m pip install -e '.[dev]' -c constraints.txt -r analysis/requirements.txt
      - name: Prepare public analytics fixtures
        run: |
          curl --fail -L --max-time 120 https://archive.ics.uci.edu/static/public/352/online+retail.zip -o /tmp/online-retail.zip
          python -m analysis.prepare
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install
        run: npm ci
        working-directory: core
      - name: Build (typecheck)
        run: npm run build
        working-directory: core
      - name: Pre-pull postgres image
        run: docker pull --quiet postgres:16
      - name: Core suite
        run: npm test
        working-directory: core
        env:
          CORE_TEST_PYTHON: python

  # R7: the ONLY benchmark check in CI — the deterministic suite-integrity
  # gate (schema + expected_object resolution + golden object/column
  # existence against the pinned snapshots). Zero model calls, no live
  # access, no Docker. Accuracy runs stay a manual command. The KB-repo CI
  # counterpart (contamination scan via the vendored wheel) is a follow-up.
  benchmark-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]' -c constraints.txt
      - name: Suite-integrity check (R7)
        run: python -m benchmark.integrity

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analytics dependencies
        run: python -m pip install -e '.[dev]' -c constraints.txt -r analysis/requirements.txt
      - name: Prepare attributed public and synthetic data
        run: |
          curl --fail -L --max-time 120 https://archive.ics.uci.edu/static/public/352/online+retail.zip -o /tmp/online-retail.zip
          python -m analysis.prepare
      - name: Offline analytics and planner contracts (no live model key)
        run: python -m pytest analysis/tests -q
